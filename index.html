<!-- Lecture (ليكچر) — v1.0 — study app for pharmacy students -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5138">
<meta name="description" content="ليكچر: ارفع محاضرتك وذاكرها بطرق صيدلانية بضغطة واحدة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ليكچر">
<title>ليكچر</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@700&text=%D9%84%D9%8A%D9%83%DA%86%D8%B1&display=swap">
<style>
:root{
  --primary:#1F5138; --primary-700:#163B29; --primary-50:#E8F1EB; --on-primary:#F5E6C8;
  --accent:#F5E6C8; --accent-ink:#5C4612;
  --bg:#FBF7EE; --surface:#FFFFFF; --line:#E6DDC8; --line-strong:#CFC3A6;
  --ink:#1D2A23; --muted:#56655C;
  --red:#B42318; --red-50:#FDECEA; --amber:#8A5300; --amber-50:#FFF3D9; --green:#1E7B4D; --green-50:#E3F4EA;
  --r-sm:10px; --r:14px; --r-lg:20px; --pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --fs-xs:13px; --fs-sm:14px; --fs:16px; --fs-md:18px; --fs-lg:21px; --fs-xl:27px;
  --shadow:0 1px 2px rgba(22,59,41,.06),0 6px 18px rgba(22,59,41,.07);
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --brand:'El Messiri','IBM Plex Sans Arabic',serif;
  --focus:0 0 0 3px #F2C14E;
  --nav-h:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.7;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);padding-top:max(var(--s2),env(safe-area-inset-top));min-height:56px}
.topbar h1{font-size:var(--fs-md);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:var(--pill);border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--primary-50)}
.banner{font-size:var(--fs-sm);padding:var(--s2) var(--s4);text-align:center}
.banner.demo{background:var(--amber-50);color:var(--amber)}
.banner.off{background:#2B2B2B;color:#F2E7CE}
.banner.ios{background:var(--primary-50);color:var(--primary-700);display:flex;gap:var(--s2);align-items:center;text-align:start}
main{flex:1;padding:var(--s4)}
footer.ver{text-align:center;color:var(--muted);font-size:var(--fs-xs);padding:var(--s2) var(--s4) calc(var(--nav-h) + var(--s5) + env(safe-area-inset-bottom))}
body.nonav footer.ver{padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500}
.nav a[aria-current="page"]{color:var(--primary)}
.nav a[aria-current="page"] .navpill{background:var(--primary-50)}
.navpill{display:grid;place-items:center;width:52px;height:28px;border-radius:var(--pill)}
h2{font-size:var(--fs-lg);margin:var(--s5) 0 var(--s3);line-height:1.4}
h3{font-size:var(--fs-md);margin:0 0 var(--s2);line-height:1.45}
p{margin:0 0 var(--s3)}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s5);border-radius:var(--pill);border:1.5px solid transparent;font-weight:700;font-size:var(--fs);cursor:pointer;text-decoration:none;text-align:center;line-height:1.3}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not([disabled]){background:var(--primary-700)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--primary)}
.btn-soft{background:var(--primary-50);color:var(--primary-700)}
.btn-amber{background:var(--amber-50);color:var(--amber);border-color:#F0D49A}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 var(--s4);font-size:var(--fs-sm)}
.btn-big{min-height:64px;font-size:var(--fs-md);border-radius:var(--r-lg)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:2px 10px;font-size:var(--fs-xs);font-weight:500;background:var(--primary-50);color:var(--primary-700);white-space:nowrap}
.chip.amber{background:var(--amber-50);color:var(--amber)}
.chip.red{background:var(--red-50);color:var(--red)}
.chip.green{background:var(--green-50);color:var(--green)}
.chip.gray{background:#EFEBE2;color:var(--muted)}
.page{display:inline-flex;align-items:center;border-radius:var(--pill);border:1px solid var(--line-strong);padding:0 8px;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500;line-height:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:500;font-size:var(--fs-sm)}
.input,select.input,textarea.input{width:100%;min-height:48px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:var(--fs)}
textarea.input{min-height:140px;resize:vertical;line-height:1.7}
.input:focus{border-color:var(--primary);outline:none;box-shadow:var(--focus)}
.choice{display:flex;gap:var(--s2);flex-wrap:wrap}
.choice label{flex:1;min-width:130px;display:flex;align-items:center;gap:var(--s2);min-height:52px;padding:0 var(--s4);border:1.5px solid var(--line-strong);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.choice input{accent-color:var(--primary);width:20px;height:20px}
.choice label:has(input:checked){border-color:var(--primary);background:var(--primary-50)}
.err{background:var(--red-50);color:var(--red);border-radius:var(--r);padding:var(--s3) var(--s4)}
.okbox{background:var(--green-50);color:var(--green);border-radius:var(--r);padding:var(--s3) var(--s4)}
.note{background:var(--amber-50);color:var(--amber);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:var(--fs-sm)}
.state{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.state .ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.state.error .ico{background:var(--red-50);color:var(--red)}
.skel{background:linear-gradient(90deg,#EFE8D8 25%,#F7F2E6 50%,#EFE8D8 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:var(--r);height:84px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--primary-50);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.skel,.spinner{animation:none}}
.caps{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.caps i{display:block;width:18px;height:9px;border-radius:var(--pill);border:1.5px solid var(--primary);background:transparent}
.caps i.on{background:var(--primary)}
.caps i.cur{width:26px;height:12px;background:var(--primary)}
.caps i.bad{background:var(--red);border-color:var(--red)}
.hero{text-align:center;padding:var(--s6) var(--s2) var(--s4)}
.wordmark{font-family:var(--brand);font-weight:700;font-size:56px;line-height:1.1;color:var(--primary);margin:var(--s3) 0 0}
.wordmark-en{letter-spacing:.34em;font-size:13px;color:var(--primary);font-weight:700;direction:ltr;margin-bottom:var(--s4)}
.status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:6px 12px;font-size:var(--fs-sm);font-weight:500}
.lect{display:flex;gap:var(--s3);align-items:flex-start;text-decoration:none;color:inherit}
.lect .thumb{flex:none;width:48px;height:56px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.lect .meta{flex:1;min-width:0}
.lect h3{margin:0 0 2px;overflow-wrap:anywhere}
.group-title{display:flex;align-items:center;gap:var(--s2);margin:var(--s5) 0 var(--s3);font-size:var(--fs-md);font-weight:700;color:var(--primary-700)}
.group-title::before{content:"";width:22px;height:10px;border-radius:var(--pill);background:var(--primary)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:var(--s3) var(--s3) var(--s3);border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--surface);cursor:pointer;text-align:start;box-shadow:var(--shadow)}
.mode:hover:not(.dim){border-color:var(--primary)}
.mode .mi{width:40px;height:40px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.mode b{font-size:15px;line-height:1.35}
.mode span.d{font-size:12.5px;color:var(--muted);line-height:1.45}
.mode .badge{position:absolute;top:10px;left:10px}
.mode.dim{opacity:.55;box-shadow:none;cursor:not-allowed;background:#F6F2E9}
.mode.locked{background:#F6F2E9}
.tabs{display:flex;gap:6px;background:#EFE8D8;border-radius:var(--pill);padding:4px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:var(--pill);background:transparent;font-weight:500;cursor:pointer;font-size:var(--fs-sm)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--primary-700);box-shadow:var(--shadow)}
.content{overflow-wrap:anywhere}
.content[dir="ltr"]{text-align:left}
.item{position:relative}
.item + .item{margin-top:var(--s3)}
.itemhead{display:flex;align-items:flex-start;gap:var(--s2);justify-content:space-between}
.itemhead h3{flex:1;min-width:0}
.flag{flex:none;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:var(--pill);display:inline-grid;place-items:center;cursor:pointer;margin:-8px -8px 0}
.flag:hover{color:var(--red);background:var(--red-50)}
.fixbtn{min-height:36px;border-radius:var(--pill);border:1px solid #F0D49A;background:var(--amber-50);color:var(--amber);font-size:12.5px;font-weight:700;padding:0 10px;cursor:pointer}
.analogy{display:flex;gap:var(--s2);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:var(--s3);margin-top:var(--s2);font-size:var(--fs-sm)}
ul.clean{margin:0;padding-inline-start:20px}
ul.clean li{margin:2px 0}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-inline-start:18px;border-inline-start:2px solid var(--line-strong);margin-inline-start:10px}
.tree li{position:relative;margin:6px 0}
.tree ul > li::before{content:"";position:absolute;inset-inline-start:-18px;top:18px;width:14px;border-top:2px solid var(--line-strong)}
.node{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.45}
.node.l0{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.node.l1{background:var(--primary-50);border-color:#BFD6C7;font-weight:700}
.reels{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:var(--s2);margin:0 calc(-1 * var(--s4));padding-inline:var(--s4);scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{flex:0 0 100%;scroll-snap-align:center;min-height:min(62vh,520px);border-radius:var(--r-lg);padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s3);background:var(--primary);color:#F7EEDC}
.reel.quiz{background:var(--surface);color:var(--ink);border:1.5px solid var(--primary)}
.reel h3{font-size:var(--fs-lg);color:inherit}
.reel .body{font-size:var(--fs-md);line-height:1.75}
.reel .page{color:inherit;border-color:currentColor;opacity:.8}
.reel .flag{color:inherit}
.opt{display:flex;align-items:flex-start;gap:var(--s2);width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:start;font-size:var(--fs);line-height:1.5}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#EFE8D8;font-size:13px;font-weight:700}
.opt.right{border-color:var(--green);background:var(--green-50)}
.opt.wrong{border-color:var(--red);background:var(--red-50)}
.opt[disabled]{cursor:default;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.analysis{margin-top:var(--s3);border-top:1px dashed var(--line-strong);padding-top:var(--s3);font-size:var(--fs-sm)}
.analysis li{margin-bottom:6px}
.golden{margin-top:var(--s3);display:flex;gap:var(--s2);align-items:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:var(--s3);font-weight:500}
.golden .lbl{font-weight:700;flex:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:var(--s2)}
table.mx{border-collapse:collapse;min-width:100%;font-size:var(--fs-sm)}
table.mx th,table.mx td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start;min-width:120px}
table.mx th{background:var(--primary);color:var(--on-primary);font-weight:700}
table.mx td:first-child{font-weight:700;background:#F8F4EA}
.mnemo{font-size:26px;font-weight:700;color:var(--primary);letter-spacing:.02em;direction:ltr;text-align:left;line-height:1.35;margin:var(--s2) 0}
.bd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--fs-sm)}
.bd .k{font-weight:700;color:var(--primary)}
.lik{display:flex;align-items:center;gap:var(--s2);font-weight:700;margin:var(--s4) 0 var(--s2)}
.lik i{width:12px;height:12px;border-radius:50%}
.sent{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-bottom:var(--s2);cursor:pointer;line-height:1.6;font-size:var(--fs)}
.sent[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-50)}
.sent.hit{border-color:var(--green);background:var(--green-50)}
.sent.miss{border-color:var(--amber);background:var(--amber-50)}
.sent.false{border-color:var(--red);background:var(--red-50)}
.fixline{display:block;margin-top:6px;font-size:var(--fs-sm);color:var(--green);font-weight:500}
.score{display:flex;align-items:center;gap:var(--s4)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:var(--fs-lg);background:conic-gradient(var(--primary) calc(var(--p)*1%),#E8E0CC 0);position:relative}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;z-index:1}
.drug-head{display:flex;gap:var(--s3);align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:var(--fs-md)}
.intro{font-size:var(--fs-md);line-height:1.7;margin:var(--s3) 0;padding-inline-start:var(--s3);border-inline-start:4px solid var(--accent)}
.kv{margin-top:var(--s2)}
.kv .k{font-weight:700;font-size:var(--fs-sm);color:var(--primary-700)}
.sets{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:4px}
.sets button{flex:none;min-height:44px;border-radius:var(--pill);border:1.5px solid var(--line-strong);background:var(--surface);padding:0 14px;cursor:pointer;font-size:var(--fs-sm);font-weight:500}
.sets button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.timeline{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line-strong);margin-inline-start:8px}
.timeline li{position:relative;padding:0 var(--s4) var(--s3)}
.timeline li::before{content:"";position:absolute;inset-inline-start:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--bg)}
.timeline a{text-decoration:none;color:inherit;display:block;min-height:44px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s3);margin-bottom:var(--s2)}
.day .sess{display:flex;gap:var(--s2);align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:var(--fs-sm)}
.day .sess:first-of-type{border-top:0}
.bar{height:10px;border-radius:var(--pill);background:#EFE8D8;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:var(--pill)}
.steps-list{counter-reset:st;list-style:none;margin:0;padding:0}
.steps-list > li{counter-increment:st;position:relative;padding-inline-start:44px;margin-bottom:var(--s5)}
.steps-list > li::before{content:counter(st);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.illus{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);background:#1D2A23;color:#fff;border-radius:var(--r);padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:var(--fs-sm)}
.toast.bad{background:var(--red)}
dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(94vw,500px);max-height:90vh;color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(20,30,25,.45)}
.dlg{padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;letter-spacing:.08em;font-weight:700}
.calc-in{display:flex;gap:var(--s2);align-items:center}
.calc-in .input{direction:ltr;text-align:left;flex:1;min-width:0}
.calc-in .btn{flex:none;white-space:nowrap}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:var(--s2);border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:var(--s6) var(--s4);text-align:center;background:var(--surface);cursor:pointer}
.dropzone:focus-within{box-shadow:var(--focus)}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.prog li{display:flex;align-items:center;gap:var(--s3);color:var(--muted)}
.prog li.now{color:var(--ink);font-weight:700}
.prog li.ok{color:var(--green)}
.prog .dot{width:28px;height:28px;flex:none;display:grid;place-items:center}

function cmp(a, op, b) {

  };

const AIX = {

const SYSTEM_STUDY = 'You are the study engine of "Lecture", an app for pharmacy students. Work ONLY from the lecture data you are given. Never add facts, doses, numbers, drugs or claims that are not in the data. If the data is not enough for the requested number of items, return fewer items. Every item must include "page" (a page number taken from the data) and "section" (the exact section title from the data it comes from). Write clear, exam-ready English. Return ONLY valid JSON in exactly the requested shape, with no markdown.';
const SYSTEM_DIGEST = 'You extract faithful, complete study digests from pharmacy lecture files. You never invent content. You return ONLY valid JSON.';
const DIGEST_PROMPT = `Read this pharmacy lecture file. Pages are numbered from 1 in file order. Produce a complete, faithful study digest in this exact JSON shape:
{"title": string, "subject": string,
 "sections": [{"title": string, "pages": [int], "points": [{"text": string, "page": int}]}],
 "keyTerms": [{"term": string, "definition": string, "page": int}],

 "lists": [{"title": string, "items": [string], "page": int}],

 "counterRelevant": boolean}
Rules: cover every section, fact, number, exception and figure caption; keep the wording faithful to the lecture; one point = one fact; use empty arrays when a category is absent; "values" follow the order of "subjects"; "counterRelevant" is true only if the content can produce realistic community-pharmacy counselling scenarios; write in English even if the lecture mixes languages; never add anything that is not in the file.`;

function normalizeDigest(o, N) {
  const d = {
    title: str(o.title), subject: str(o.subject),
    sections: arr(o.sections).map(s => ({ title: str(s.title), pages: arr(s.pages).map(p => pageNum(p, N)).filter(Boolean), points: arr(s.points).map(p => ({ text: str(p && p.text), page: pageNum(p && p.page, N) })).filter(p => p.text) })).filter(s => s.title && s.points.length),
    keyTerms: arr(o.keyTerms).map(k => ({ term: str(k.term), definition: str(k.definition), page: pageNum(k.page, N) })).filter(k => k.term && k.definition),
    drugs: arr(o.drugs).map(x => ({ name: str(x.name), class: str(x.class), mechanism: str(x.mechanism), uses: strs(x.uses), sideEffects: strs(x.sideEffects), contraindications: strs(x.contraindications), interactions: strs(x.interactions), notes: strs(x.notes), page: pageNum(x.page, N) })).filter(x => x.name),
    lists: arr(o.lists).map(l => ({ title: str(l.title), items: strs(l.items), page: pageNum(l.page, N) })).filter(l => l.title && l.items.length),
    comparisons: arr(o.comparisons).map(c => ({ title: str(c.title), subjects: strs(c.subjects), features: arr(c.features).map(f => ({ feature: str(f.feature), values: strs(f.values) })).filter(f => f.feature), page: pageNum(c.page, N) })).filter(c => c.subjects.length >= 2 && c.features.length),
    calculations: arr(o.calculations).map(c => ({ topic: str(c.topic), formula: str(c.formula), example: str(c.example), page: pageNum(c.page, N) })).filter(c => c.topic && (c.formula || c.example)),
    counterRelevant: o.counterRelevant === true

  for (const s of d.sections) if (!s.pages.length) s.pages = [...new Set(s.points.map(p => p.page).filter(Boolean))].sort((a, b) => a - b);
  if (!d.sections.length) throw new AppError('لم أستطع قراءة محتوى كافٍ من هذا الملف. تأكد أنه محاضرة واضحة وأعد المحاولة.');

}
async function aiDigest(fileBlob, pageTexts) {
  const b64 = await blobToBase64(fileBlob);
  let text = '';
  if (pageTexts.join('').trim().length > 200) {
    for (let i = 0; i < pageTexts.length; i++) { const chunk = `\n[[PAGE ${i + 1}]]\n${pageTexts[i]}`; if (text.length + chunk.length > LIMITS.textCap) break; text += chunk; }
  }
  const prompt = DIGEST_PROMPT + (text ? '\n\nThe text layer of the file follows, with page markers. Use these page numbers:\n' + text : '');
  const out = await AIX.call({ parts: [{ inline_data: { mime_type: 'application/pdf', data: b64 } }, { text: prompt }], system: SYSTEM_DIGEST, timeout: 240000 });
  return normalizeDigest(out, pageTexts.length);
}

const LADDER_FIELDS = `Fields by type:

    drugs: `For every drug in the data write a profile in which the drug introduces itself in the first person. Use only facts from the data and leave a field empty ("" or []) when the data lacks it. JSON: {"drugs":[{"name":string,"class":string,"intro":string (2-3 sentences starting with "I am"),"mechanism":string,"uses":[string],"sideEffects":[string],"warnings":[string],"interactions":[string],"pearl":string (one memorable fact),"page":int,"section":string}]}`,
    counter: `Write 5 realistic community-pharmacy counter scenarios that test this lecture. Wrong options must be plausible and non-obvious. JSON: {"cases":[{"scenario":string,"question":string,"options":[4 strings],"answer":int,"analysis":[4 strings, one per option],"golden":string,"page":int,"section":string}]}`,

const mcqOk = (q) => q && str(q.question) && arr(q.options).length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < arr(q.options).length;

function normalizeOutput(mode, o, N) {

    case 'drugs': r = { drugs: arr(o.drugs).filter(x => str(x.name)).map(x => normItem({ name: str(x.name), class: str(x.class), intro: str(x.intro), mechanism: str(x.mechanism), uses: strs(x.uses), sideEffects: strs(x.sideEffects), warnings: strs(x.warnings), interactions: strs(x.interactions), pearl: str(x.pearl), page: x.page, section: x.section }, N)) }; if (!r.drugs.length) r = null; break;
    case 'counter': r = { cases: arr(o.cases).filter(c => mcqOk(c) && str(c.scenario)).map(c => normItem({ scenario: str(c.scenario), question: str(c.question), options: strs(c.options), answer: c.answer, analysis: strs(c.analysis), golden: str(c.golden), page: c.page, section: c.section }, N)) }; if (!r.cases.length) r = null; break;

    case 'review': { const rank = { high: 0, medium: 1, low: 2 }; r = { items: arr(o.items).filter(i => str(i.point)).map(i => normItem({ point: str(i.point), likelihood: rank[i.likelihood] != null ? i.likelihood : 'medium', page: i.page, section: i.section }, N)).sort((a, b) => rank[a.likelihood] - rank[b.likelihood]) }; if (!r.items.length) r = null; break; }

  if (nDays < 1) throw new AppError('اختر موعد امتحان بعد اليوم.');

  const days = Array.from({ length: nDays }, (_, i) => ({ date: start + i * DAY_MS, sessions: [], used: 0 }));
  const eve = nDays >= 2 ? nDays - 1 : -1;
  const studyDays = eve >= 0 ? eve : nDays;

  if (eve >= 0) {
    const seen = new Set();
    for (const it of items) { if (seen.has(it.lectureId)) continue; seen.add(it.lectureId); days[eve].sessions.push({ type: 'quick', lectureId: it.lectureId, lectureTitle: it.lectureTitle, section: '', minutes: 20 }); days[eve].used += 20; }
  }

const Auth = {
  mode: 'local', fb: null, auth: null, cb: null,
  setupLocal() { this.mode = 'local'; },
  setupFirebase(authM, app) { this.mode = 'firebase'; this.fb = authM; this.auth = authM.getAuth(app); },
  start(cb) {
    this.cb = cb;

      this.fb.getRedirectResult(this.auth).catch(e => toast(authErr(e), true));

        if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return withTimeout(new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.async = true;
    s.onload = () => { if (window.pdfjsLib) { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); } else rej(new Error('pdfjs')); };
    s.onerror = () => rej(new Error('pdfjs')); document.head.appendChild(s);
  }), 25000);
}
async function inspectPdf(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') throw new AppError('اختر ملفًا بصيغة PDF فقط.');
  if (file.size > LIMITS.maxMB * 1048576) throw new AppError('حجم الملف أكبر من ' + LIMITS.maxMB + ' ميغابايت. اختر ملفًا أصغر أو قسّم المحاضرة.');
  const buf = await file.arrayBuffer();
  if (String.fromCharCode(...new Uint8Array(buf.slice(0, 5))) !== '%PDF-') throw new AppError('هذا الملف ليس PDF صالحًا.');
  const hash = await sha256Hex(buf);
  const r = { hash, pages: 0, pageTexts: [], scanned: false, textOk: false };
  try {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    r.pages = doc.numPages;
    if (r.pages > LIMITS.maxPages) throw new AppError('المحاضرة أطول من ' + LIMITS.maxPages + ' صفحة. قسّمها إلى أجزاء أصغر.');
    for (let i = 1; i <= r.pages; i++) { const pg = await doc.getPage(i); const tc = await pg.getTextContent(); r.pageTexts.push(tc.items.map(x => x.str).join(' ').replace(/\s+/g, ' ').trim()); }
    r.scanned = r.pageTexts.join('').length / Math.max(1, r.pages) < LIMITS.scannedChars; r.textOk = true;
    if (doc.destroy) doc.destroy();
  } catch (e) {
    if (e instanceof AppError) throw e;
    if (e && e.name === 'PasswordException') throw new AppError('الملف محمي بكلمة مرور. احفظه دون حماية ثم أعد المحاولة.');
    r.textOk = false;
  }
  return r;
}

async function generateOutput(lecture, mode, part, opts = {}) {
  const d = lecture.digest; const N = lecture.pageCount || 0;
  let content;
  if (mode === 'teach') {
    const { section, related } = sectionData(d, opts.sectionTitle);
    let prompt = `The student explained the section below in their own words. Compare it with the lecture data for that section. Judge meaning, not wording or language (the student may write in Arabic). Be strict but kind. Write the feedback in English. JSON: {"score":int 0-10,"correct":[string],"missing":[string],"wrong":[{"said":string,"fix":string,"page":int}],"summary":string,"page":int,"section":string}`;
    if (opts.fix) prompt += `\nA pharmacist reviewer confirmed that this part of your previous feedback was WRONG:\n"${opts.fix.itemText}"\nReported problem: ${opts.fix.reason}${opts.fix.note ? ' — ' + opts.fix.note : ''}\nCorrect it strictly according to the section data.`;
    prompt += `\n\nSECTION DATA:\n${JSON.stringify({ section, related })}\n\nSTUDENT EXPLANATION:\n${opts.studentText}`;
    content = normalizeOutput('teach', await AIX.call({ parts: [{ text: prompt }], system: SYSTEM_STUDY }), N);
    content.section = section.title;
  } else content = normalizeOutput(mode, await AIX.call({ parts: [{ text: modePrompt(mode, d, opts) }], system: SYSTEM_STUDY }), N);
  return content;
}

  const c = await Store.get('codes', code);
  if (!c) throw new AppError('الكود غير صحيح.');
  if (c.redeemedBy) throw new AppError('استُعمل هذا الكود من قبل.');
  const base = Math.max(Date.now(), S.profile.subscriptionUntil || 0);
  const until = base + (Number(c.days) || LIMITS.subDays) * DAY_MS;
  const res = await Store.batch([
    { op: 'set', col: 'codes', id: code, data: { redeemedBy: S.user.uid, redeemedAt: Date.now() }, merge: true },
    { op: 'set', col: 'users', id: S.user.uid, data: { subscriptionUntil: until, lastCode: code }, merge: true }]);
  if (res && res.queued) throw new AppError('لم يكتمل التفعيل بسبب الاتصال. أعد المحاولة وأنت متصل.');
  setProfile({ subscriptionUntil: until, lastCode: code });
  return until;

async function initFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [appM, authM, fsM] = await withTimeout(Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]), 20000);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  let db;
  try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
  catch (e) { db = fsM.getFirestore(app); }
  Store = makeFirestoreStore(fsM, db);
  Auth.setupFirebase(authM, app);
}
function startAuth() { S.authReady = true; renderBanners(); Auth.start(handleUser); }
async function boot() {
  renderBanners();
  window.addEventListener('online', renderBanners); window.addEventListener('offline', renderBanners);

  if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
    try { await initFirebase(); }
    catch (e) {
      v.textContent = '';

  startAuth();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* app works without offline cache */ });
}
boot();
